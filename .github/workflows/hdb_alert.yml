name: HDB Resale Alert

on:
  schedule:
    # Runs every day at 9:00 AM Singapore time (SGT = UTC+8 → 01:00 UTC)
    - cron: "0 1 * * *"

  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  check-transactions:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout your repo ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Set up Python ──────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Install dependencies ───────────────────────────────────────
      - name: Install dependencies
        run: pip install requests

      # ── 4. Create state directory ──────────────────────────────────────
      - name: Create state directory
        run: mkdir -p ${{ runner.temp }}/hdb-state

      # ── 5. Restore cached state (tracks which IDs we've already seen) ─
      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hdb-state/last_seen.json
          key: hdb-state-${{ runner.os }}-${{ github.repository }}
          restore-keys: |
            hdb-state-${{ runner.os }}-

      # ── 6. Copy state file into root working directory ────────────────
      - name: Setup state file
        run: |
          if [ -f "${{ runner.temp }}/hdb-state/last_seen.json" ]; then
            cp "${{ runner.temp }}/hdb-state/last_seen.json" ./last_seen.json
          fi

      # ── 7. FIXED: Points accurately to hdb_alert_IMPROVED_SORT.py ─────
      - name: Run HDB alert check
        env:
          HDB_STREET_NAME:            ${{ vars.HDB_STREET_NAME }}
          HDB_FLAT_TYPE:              ${{ vars.HDB_FLAT_TYPE }}
          HDB_TOWN:                   ${{ vars.HDB_TOWN }}
          RESALE_REGISTRATION_MONTHS: ${{ vars.RESALE_REGISTRATION_MONTHS }}
          GMAIL_ADDRESS:              ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD:         ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO_EMAIL:             ${{ secrets.ALERT_TO_EMAIL }}
        run: python hdb_alert_IMPROVED_SORT.py

      # ── 8. Copy state file back to cache location ─────────────────────
      - name: Save state file
        if: always()
        run: |
          mkdir -p "${{ runner.temp }}/hdb-state"
          if [ -f "./last_seen.json" ]; then
            cp "./last_seen.json" "${{ runner.temp }}/hdb-state/last_seen.json"
          fi

      # ── 9. Save updated state so the next run knows what it already saw ─
      - name: Save updated state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/hdb-state/last_seen.json
          key: hdb-state-${{ runner.os }}-${{ github.repository }}
