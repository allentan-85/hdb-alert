name: HDB Resale Alert

on:
  schedule:
    # 9:00 AM SGT  (01:00 UTC)
    - cron: "0 1 * * *"
    # 9:00 PM SGT  (13:00 UTC)
    - cron: "0 13 * * *"

  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  check-transactions:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Python ─────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        run: pip install requests

      # ── 4. Restore state (last_seen.json) ─────────────────────────────
      # Uses restore-keys as fallback — always picks up the most recent cache
      - name: Restore state cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: last_seen.json
          key: hdb-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            hdb-state-${{ runner.os }}-

      # ── 5. Debug: show if state file was found ────────────────────────
      - name: Check state file
        run: |
          if [ -f "last_seen.json" ]; then
            echo "✅ State file found:"
            cat last_seen.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'  Seen IDs: {len(d.get(\"seen_ids\",[]))}')"
          else
            echo "ℹ️ No state file — first run or cache expired"
          fi

      # ── 6. Run script ─────────────────────────────────────────────────
      - name: Run HDB alert check
        env:
          HDB_STREET_NAME:            ${{ vars.HDB_STREET_NAME }}
          HDB_FLAT_TYPE:              ${{ vars.HDB_FLAT_TYPE }}
          HDB_TOWN:                   ${{ vars.HDB_TOWN }}
          RESALE_REGISTRATION_MONTHS: ${{ vars.RESALE_REGISTRATION_MONTHS }}
          MIN_LEASE_YEAR:             ${{ vars.MIN_LEASE_YEAR }}
          GMAIL_ADDRESS:              ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD:         ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO_EMAIL:             ${{ secrets.ALERT_TO_EMAIL }}
        run: python hdb_alert.py

      # ── 7. Save state ─────────────────────────────────────────────────
      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: last_seen.json
          key: hdb-state-${{ runner.os }}-${{ github.run_id }}
