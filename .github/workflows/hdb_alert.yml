name: HDB Resale Transaction Alert

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hdb-resale-alert
  cancel-in-progress: false

jobs:
  check-hdb-resale:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify monitor script exists
        run: |
          test -f hdb-resale-alert/monitor.py
          python -m py_compile hdb-resale-alert/monitor.py

      - name: Check HDB resale transactions
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: tyuehlun85@gmail.com
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          HDB_ALERT_TIMEZONE: "Asia/Singapore"
          HDB_ALERT_SEND_ON_FIRST_RUN: "false"
        run: python hdb-resale-alert/monitor.py

      - name: Commit alert state
        run: |
          if git diff --quiet -- hdb-resale-alert/state.json; then
            echo "No alert state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hdb-resale-alert/state.json
          git commit -m "Update HDB resale alert state"
          git push
